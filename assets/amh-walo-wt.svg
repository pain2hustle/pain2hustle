<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" aria-label="AMH · WALO AI · WT">
<style>
text{font:900 80px 'Arial Black','Segoe UI Black','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:4px}
.a{fill:#ffd08a;stroke:#f5a524;stroke-width:2.5;filter:url(#go)}
.w{fill:#cfe6ff;stroke:#1470d6;stroke-width:2.5;filter:url(#gb)}
.t{fill:#d9ffe6;stroke:#22c55e;stroke-width:2.5;filter:url(#gg)}
.d{fill:#7a8599;font-size:60px}
.p{animation:p 2.8s ease-in-out infinite}.p2{animation-delay:.9s}.p3{animation-delay:1.8s}
@keyframes p{0%,100%{opacity:1}50%{opacity:.72}}
</style>
<defs>
<filter id="go" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#f5a524"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gb" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#1470d6"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gg" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#22c55e"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<text x="450" y="96" text-anchor="middle" textLength="860" lengthAdjust="spacingAndGlyphs"><tspan class="a p">AMH</tspan><tspan class="d"> · </tspan><tspan class="w p p2">WALO AI</tspan><tspan class="d"> · </tspan><tspan class="t p p3">WT</tspan></text>
</svg>
